name: PR validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: pr-validation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Select change-scoped validation
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: >-
          node scripts/ci/select-pr-validation.js
          --base "$BASE_SHA"
          --head "$HEAD_SHA"
          --plan .ci/pr-validation-plan.json
          --github-output "$GITHUB_OUTPUT"

      - name: Run syntax ratchets and related tests
        run: node scripts/ci/run-pr-validation.js --plan .ci/pr-validation-plan.json
